backend:
  name: github
  repo: zhjngli/the-principles-and-feelings-cookbook
  branch: main

publish_mode: editorial_workflow

media_folder: public/assets
public_folder: /assets

collections:
  - name: 'site_pages'
    label: 'site pages'
    files:
      - name: 'home'
        label: 'home page'
        file: 'writing/about/index.md'
        editor:
          preview: false
        fields:
          - { label: 'Title', name: 'title', widget: 'string', required: false }
          - { label: 'Body', name: 'body', widget: 'markdown' }
      - name: 'menu_page'
        label: 'menu page copy'
        file: 'writing/menu/index.md'
        editor:
          preview: false
        fields:
          - { label: 'Title', name: 'title', widget: 'string', required: false }
          - { label: 'Body', name: 'body', widget: 'markdown' }
      - name: 'menu_items'
        label: 'menu items'
        file: 'src/data/menu.json'
        editor:
          preview: false
        fields:
          - label: 'Sections'
            name: 'sections'
            widget: 'list'
            fields:
              - { label: 'Name', name: 'name', widget: 'string' }
              - label: 'Items'
                name: 'items'
                widget: 'list'
                fields:
                  - { label: 'Name', name: 'name', widget: 'string' }
                  - { label: 'Description', name: 'description', widget: 'string', required: false }
                  - {
                      label: 'Recipe path',
                      name: 'recipe',
                      widget: 'string',
                      required: false,
                      hint: 'Optional path like recipes/baked-chicken-wings'
                    }
  - name: 'recipes'
    label: 'recipe'
    folder: 'writing/recipes'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    path: '{{slug}}/index'
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Slug', name: 'slug', widget: 'string' }
      - { label: 'Tags', name: 'tags', widget: 'list' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: 'principles'
    label: 'principle'
    folder: 'writing/principles'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    path: '{{slug}}/index'
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Slug', name: 'slug', widget: 'string' }
      - { label: 'Tags', name: 'tags', widget: 'list' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: 'techniques'
    label: 'technique'
    folder: 'writing/techniques'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    path: '{{slug}}/index'
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Slug', name: 'slug', widget: 'string' }
      - { label: 'Tags', name: 'tags', widget: 'list' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
